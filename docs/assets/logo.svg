<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .b { animation: sort 8s cubic-bezier(.65, 0, .35, 1) infinite both; }
    @keyframes sort {
      0%, 18% { transform: translateY(var(--dy)); }
      42%, 88% { transform: none; }
      100% { transform: translateY(var(--dy)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .b { animation: none; }
    }
  </style>
  <rect width="128" height="128" rx="28" fill="#18192d"/>
  <defs>
    <linearGradient id="g" x1="17" y1="64" x2="110" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15e4c0"/>
      <stop offset="1" stop-color="#0093f3"/>
    </linearGradient>
  </defs>
  <g fill="url(#g)">
    <rect class="b" style="--dy: 28px" x="53" y="25" width="22" height="8" rx="4"/>
    <rect class="b" style="--dy: 42px" x="46" y="39" width="36" height="8" rx="4"/>
    <rect class="b" style="--dy: -28px" x="39" y="53" width="50" height="8" rx="4"/>
    <rect class="b" style="--dy: 28px" x="32" y="67" width="64" height="8" rx="4"/>
    <rect class="b" style="--dy: -14px" x="25" y="81" width="78" height="8" rx="4"/>
    <rect class="b" style="--dy: -56px" x="17" y="95" width="94" height="8" rx="4"/>
  </g>
</svg>
