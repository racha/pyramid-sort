# Publishes to https://www.npmjs.com/package/pyramid-sort
#
# Setup (one-time):
# npmjs.com → pyramid-sort → Settings → Trusted Publisher
#   - Repository owner: racha
#   - Repository: pyramid-sort
#   - Workflow filename: publish-npm.yml
#   - Permissions: npm publish
#
# Then either push a semver tag (v1.2.3), or run this workflow manually (Actions tab).

name: Publish to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm install --global npm@latest
      - run: npm ci

      - name: Publish package
        run: npm publish --access public --provenance
